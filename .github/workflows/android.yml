name: android

on:
  push:
    # 改安卓不该把 iOS 那条流水线也叫醒，反之亦然。
    # 源码是分开封存的，所以按封存目录分流就够准。
    paths:
      - 'enc-android/**'
      - 'tools/tendpack.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 仓库里只有密文。明文到这一步才出现，跑完随工作目录一起没了。
      - name: Unlock source
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: node tools/tendpack.js unseal --src enc-android --out android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 签名密钥从 secret 里铺到 runner 上，路径经 TEND_KEYSTORE 传给 gradle。
      # 没配就退回 debug 签名——包照样能装，只是以后换密钥得重装一次。
      - name: 铺签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.TEND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TEND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEND_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没配签名密钥，这次用 debug key 出包。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tend-release.p12"
          {
            echo "TEND_KEYSTORE=$RUNNER_TEMP/tend-release.p12"
            echo "TEND_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TEND_KEY_ALIAS=$KEY_ALIAS"
            echo "TEND_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release apk
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      # 产物也封起来再上传。公开仓库的 artifact 谁都能下，
      # 一个签过名的 apk 被别人拿去反编译、二次分发，那等于把 App 送出去。
      - name: Seal the apk
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: |
          node tools/tendpack.js seal-file \
            --in android/app/build/outputs/apk/release/app-release.apk \
            --out Tend.apk.enc

      - uses: actions/upload-artifact@v4
        with:
          name: Tend-apk-sealed
          path: Tend.apk.enc
          retention-days: 14
