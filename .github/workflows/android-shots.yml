name: android-shots

on:
  push:
    # 改安卓不该把 iOS 那条流水线也叫醒，反之亦然。
    # 源码是分开封存的，所以按封存目录分流就够准。
    paths:
      - 'enc-android/**'
      - 'tools/tendpack.js'
      - 'tools/shots.sh'
      - '.github/workflows/android-shots.yml'
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    # 卡住的时候自己结束，别占着跑者一直转。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unlock source
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: node tools/tendpack.js unseal --src enc-android --out android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 这里原来挂的是 android-actions/setup-android@v3。它每次都会先跑一遍 `sdkmanager tools`，
      # 而 Google 把老的 tools 包下架了（2026-09-15 起），那一步必然报 Failed to find package 'tools'，
      # 整条流水线就断在这儿——和工程本身没关系。
      # runner 镜像本来就带着 Android SDK（/usr/local/lib/android/sdk），ANDROID_HOME 也是现成的，
      # 所以直接用系统那一份，只补我们真正缺的 platform 和 build-tools。
      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 签名密钥和 android.yml 用同一份，这样拍的就是装到手机上的那个包。
      - name: 铺签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.TEND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TEND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEND_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没配签名密钥，这次用 debug key 出包。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tend-release.p12"
          {
            echo "TEND_KEYSTORE=$RUNNER_TEMP/tend-release.p12"
            echo "TEND_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TEND_KEY_ALIAS=$KEY_ALIAS"
            echo "TEND_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 取音色引擎（sherpa-onnx 的安卓预编译包）
        working-directory: android
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -l app/libs

      # 拍的是 release 那一份——和装到手机上的完全是同一个包，
      # 不是「开发时看着还行、发出去缩了一圈」那种情况。
      - name: Build release apk
        working-directory: android
        run: gradle assembleRelease --no-daemon

      # 模拟器要能访问 /dev/kvm 才起得来。这一步不做，它会一直卡在开机，
      # adb 只会回一句 device offline——看起来像脚本坏了，其实是没有加速。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          # 模拟器是 x86_64，所以拍截图用的是同一份源码出的另一个架构包。
          script: bash tools/shots.sh android/app/build/outputs/apk/release/app-x86_64-release.apk

      - name: Seal the shots
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: |
          zip -qr Tend-shots.zip shots
          node tools/tendpack.js seal-file --in Tend-shots.zip --out Tend-shots.zip.enc

      - uses: actions/upload-artifact@v4
        with:
          name: Tend-android-shots-sealed
          path: Tend-shots.zip.enc
          retention-days: 14
