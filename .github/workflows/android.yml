name: android

on:
  push:
    # 改安卓不该把 iOS 那条流水线也叫醒，反之亦然。
    # 源码是分开封存的，所以按封存目录分流就够准。
    paths:
      - 'enc-android/**'
      - 'tools/tendpack.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 仓库里只有密文。明文到这一步才出现，跑完随工作目录一起没了。
      - name: Unlock source
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: node tools/tendpack.js unseal --src enc-android --out android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 这里原来挂的是 android-actions/setup-android@v3。它每次都会先跑一遍 `sdkmanager tools`，
      # 而 Google 把老的 tools 包下架了（2026-09-15 起），那一步必然报 Failed to find package 'tools'，
      # 整条流水线就断在这儿——和工程本身没关系。
      # runner 镜像本来就带着 Android SDK（/usr/local/lib/android/sdk），ANDROID_HOME 也是现成的，
      # 所以直接用系统那一份，只补我们真正缺的 platform 和 build-tools。
      - name: Install SDK platforms
        run: |
          # runner 镜像本来就带着 Android SDK，但它不在 PATH 上——以前是 setup-android 帮我们加进去的。
          # cmdline-tools 那个目录名带着版本号（16.0），以后还会变，所以按通配找一遍。
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 签名密钥从 secret 里铺到 runner 上，路径经 TEND_KEYSTORE 传给 gradle。
      # 没配就退回 debug 签名——包照样能装，只是以后换密钥得重装一次。
      - name: 铺签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.TEND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TEND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEND_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没配签名密钥，这次用 debug key 出包。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tend-release.p12"
          {
            echo "TEND_KEYSTORE=$RUNNER_TEMP/tend-release.p12"
            echo "TEND_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TEND_KEY_ALIAS=$KEY_ALIAS"
            echo "TEND_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 取音色引擎（sherpa-onnx 的安卓预编译包）
        working-directory: android
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -l app/libs

      - name: Build release apk
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      # 产物也封起来再上传。公开仓库的 artifact 谁都能下，
      # 一个签过名的 apk 被别人拿去反编译、二次分发，那等于把 App 送出去。
      - name: Seal the apk
        env:
          TEND_SOURCE_KEY: ${{ secrets.TEND_SOURCE_KEY }}
        run: |
          # 按架构拆包之后，发给大家的是真机那一份（arm64-v8a）。
          # 模拟器那一份不出这个流水线——它只在 android-shots 里拍截图用。
          node tools/tendpack.js seal-file \
            --in android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            --out Tend.apk.enc

      - uses: actions/upload-artifact@v4
        with:
          name: Tend-apk-sealed
          path: Tend.apk.enc
          retention-days: 14
